              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/sync/schedule:
    post:
      operationId: triggerScheduleSync
      summary: Manually trigger a CFBD schedule sync (site admin only)
      description: >
        Requires is_site_admin=true (requireSiteAdmin). Runs synchronously:
        pulls FBS teams, the regular-season calendar, and regular-season
        games for `season_year` from CollegeFootballData.com and
        idempotently upserts teams/weeks/games. Always records a
        `sync_runs` row (whether the CFBD call succeeds or fails) and, on
        success, an `audit_log` row (action=schedule_sync). This endpoint
        is additive to the daily cron sync in cmd/server, not a replacement
        for it.
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerScheduleSyncRequest"
      responses:
        "200":
          description: >
            The sync_runs record for this run. status=success or
            status=failed (see the `error` field) — a failed CFBD call
            still returns 200 with the recorded failure, since the admin
            action itself (recording the attempt) succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRun"
        "400":
          description: Missing or out-of-range season_year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/sync/runs:
    get:
      operationId: listSyncRuns
      summary: List recent sync runs (site admin only)
      description: Requires is_site_admin=true (requireSiteAdmin). Newest first.
      tags:
        - Admin
      responses:
        "200":
          description: Recent sync runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRun"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/leagues:
