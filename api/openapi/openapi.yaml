openapi: 3.1.0
info:
  title: Survivor League API
  description: >
    REST API for the College Football Survivor Pool app. This spec is the
    source of truth for the shared TypeScript client generated into
    packages/api-client (consumed by both web and mobile).

    Phase 1 added auth (register/login/refresh/logout) and the current-user
    endpoints. Phase 2 added league CRUD, membership, the invite-code join
    flow, and the conferences list. Phase 3 added read-only schedule
    endpoints (weeks/games/teams, populated by a CFBD sync) and the first
    site-admin endpoints (triggering/viewing that sync). Phase 4 added pick
    submission/retrieval with server-enforced per-game locking and the
    no-repeat-team rule, plus pre-lock pick-hiding for other league members.
    Phase 5 adds the leaderboard endpoint — the grading/elimination pipeline
    and the live poll loop that drives it are internal (internal/grading,
    internal/livepoll), not client-facing API surface. Phase 6 adds the
    commissioner buy-back endpoint (one-time-ever reinstatement of an
    eliminated member). Phase 7 adds notifications: device-token
    registration and notification preferences (the notification_outbox
    dispatcher, Expo Push/Resend delivery, and the five trigger types —
    pick_reminder, eliminated, survived, mass_wipeout, buyback — are
    internal, internal/notify, not client-facing API surface beyond these
    two resources). Phase 8 completes site-admin: cross-league oversight
    (GET /admin/leagues, GET /admin/users), user disable/enable, a
    single-game CFBD resync (the direct unblock mechanism for a game left
    postponed/canceled by the grading pipeline), and the audit log viewer
    (GET /admin/audit-log) — on top of Phase 3's schedule-sync trigger and
    history endpoints. A post-Phase-10 addition (the 10-phase roadmap
    ended at Phase 10 "launch readiness") adds password reset
    (forgot-password/reset-password) and email verification
    (verify-email/resend-verification) — both explicitly deferred out of
    Phase 1 pending a working email provider, unblocked now that Phase 7
    built one (internal/notify). Sent directly via the configured
    EmailSender, independent of Phase 7's notification_outbox dispatcher.
    Not a login gate: registration still auto-issues tokens immediately;
    `User.email_verified_at` is informational.
  version: 0.9.0
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness check
      description: >
        Returns 200 with db=ok when the API can reach Postgres, or a 503
        with an error message otherwise.
      security: []
      tags:
        - System
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/register:
    post:
      operationId: registerUser
      summary: Create a new account and start a session
      description: >
        Validates email format and a minimum-8-character password, hashes
        the password with argon2id, and creates the user. If `email`
        case-insensitively matches the server's configured ADMIN_EMAIL, the
        new user is created with is_site_admin=true. On success, behaves
        exactly like POST /auth/login: an access token is returned in the
        body and a rotating refresh token is both set as an httpOnly cookie
        (used by the web client) and included in the body (used by the
        mobile client, which has no cookie jar to read Set-Cookie from).
        There is no email-verification gate in this phase.
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; session started
          headers:
            Set-Cookie:
              description: >
                Sets the `refresh_token` cookie (httpOnly, SameSite=Strict,
                Secure in production).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid email, weak password, or missing display_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate and start a session
      description: >
        Verifies the argon2id password hash. On success, issues a 15-minute
        JWT access token (HS256, claims include sub and is_site_admin) and
        a 30-day rotating refresh token — stored server-side as a SHA-256
        hash, set client-side as an httpOnly `refresh_token` cookie
        (SameSite=Strict, Secure in production) for web, and also returned
        in the body for mobile (no cookie jar to read Set-Cookie from).
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session started
          headers:
            Set-Cookie:
              description: Sets the `refresh_token` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and mint a new access token
      description: >
        Reads the refresh token from the `refresh_token` cookie if present,
        else from the JSON body (mobile has no cookie jar and sends it
        explicitly). The presented token must match a non-revoked,
        non-expired row; on success it is revoked (rotated) and a new
        access/refresh pair is issued and stored. Reusing an
        already-rotated, expired, or unknown token always fails with 401. A
        new `refresh_token` cookie is set regardless of caller type
        (harmless for mobile, required for web).
      security: []
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session refreshed
          headers:
            Set-Cookie:
              description: Sets the new `refresh_token` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Missing, invalid, expired, or already-used refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      summary: End the current session
      description: >
        Reads the refresh token the same dual cookie/body way as
        POST /auth/refresh and revokes it (a missing/unknown token is a
        no-op, not an error). Clears the `refresh_token` cookie.
      security: []
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Session ended
          headers:
            Set-Cookie:
              description: Clears the `refresh_token` cookie.
              schema:
                type: string

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset email
      description: >
        Post-Phase-10 addition (deferred out of Phase 1 pending a working
        email provider). ALWAYS responds 202 with the exact same body,
        whether or not `email` matches an account — this endpoint must
        never leak account existence via response differences. If a match
        is found, a password reset token is generated (hashed at rest,
        1-hour expiry, single-use — same shape as a refresh token) and
        emailed via the configured EmailSender (Resend) as a link of the
        form `{WEB_BASE_URL}/reset-password?token=...`. Sent directly, not
        via the notification_outbox dispatcher (see internal/auth/
        password_reset.go for why).
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: >
            Always returned, regardless of whether the email matched an
            account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password using a token from a forgot-password email
      description: >
        Validates `token` against a non-expired, non-used
        password_reset_tokens row. On success: hashes `new_password` with
        the same argon2id helper Register/Login use, updates the user,
        marks the token used, and revokes every refresh token the user
        currently holds — a password reset kills all other active
        sessions. Invalid, expired, and already-used tokens all return the
        same generic 400 error (undifferentiated on purpose, so the
        response can't be used to distinguish why a token failed).
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: >
            Invalid request (weak new_password), or an invalid/expired/
            already-used token — both cases use this same status and a
            generic message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address using a token from a verification email
      description: >
        Validates `token` the same way POST /auth/reset-password does
        (against email_verification_tokens). On success, sets
        `users.email_verified_at` and marks the token used. NOT a login
        gate — an unverified user can fully use the app; this is purely
        informational/eventual.
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: >
            Invalid, expired, or already-used token (undifferentiated,
            same generic message treatment as POST /auth/reset-password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend the email verification link
      description: >
        Requires auth — unlike forgot-password, this is only meaningful
        for a logged-in user. If the caller's email is already verified,
        this is a silent no-op (still 200), not an error. Otherwise,
        invalidates any prior unused verification token for the caller
        (so at most one is ever valid at a time) and sends a fresh one via
        the same code path POST /auth/register's automatic first send
        uses.
      tags:
        - Auth
      responses:
        "200":
          description: >
            Verification email sent (or a no-op, if already verified).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      summary: Get the current user
      tags:
        - Users
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      summary: Update the current user's profile
      description: Only display_name is editable in this phase.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing display_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/device-tokens:
    post:
      operationId: registerDeviceToken
      summary: Register (or re-register) an Expo push token for the current user
      description: >
        Upserts on the token itself (device_tokens.token is globally
        UNIQUE, not per-user) — re-registering a token already on file
        reassigns it to the caller and refreshes platform/last_used_at
        rather than erroring. Called by the mobile app after obtaining an
        Expo push token via expo-notifications (web has no push
        capability per the plan's stack — Expo Push is mobile-only).
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceTokenRequest"
      responses:
        "200":
          description: The upserted device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
        "400":
          description: Missing/invalid expo_push_token or platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDeviceToken
      summary: Remove a device token (e.g. on logout/uninstall)
      description: >
        Idempotent: removing a token that doesn't exist (or belongs to a
        different user) is still a 204, not a 404.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteDeviceTokenRequest"
      responses:
        "204":
          description: Token removed (or was already absent)
        "400":
          description: Missing expo_push_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Get the current user's notification preferences
      description: >
        Lazily creates a default row (every type on, per the schema's
        column defaults) on first access — a brand-new user with no prior
        PUT still gets sensible defaults back rather than a 404. `survived`
        is the plan's one opt-out-by-default-ON type (push-only,
        defaults true, the user may disable it); every other type also
        defaults true but is not singled out as opt-out framing in the
        plan — the schema/behavior is identical either way (a boolean the
        user can flip), this description just reflects the plan's own
        framing for `survived`.
      tags:
        - Users
      responses:
        "200":
          description: The current user's notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateNotificationPreferences
      summary: Replace the current user's notification preferences
      description: >
        A full-replace upsert — all seven fields are required in the body,
        matching the response shape of GET on this same resource.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: The updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conferences:
    get:
      operationId: listConferences
      summary: List the canonical FBS conferences leagues can be created for
      description: >
        Returns the hardcoded, stable list of FBS conference names (see
        internal/schedule/conferences.go) that POST /leagues validates its
        `conference` field against. This is deliberately not sourced from
        `teams.conference` (which is empty until Phase 3's CFBD sync runs)
        — league creation must not depend on schedule data that doesn't
        exist yet.
      security: []
      tags:
        - Conferences
      responses:
        "200":
          description: The canonical FBS conference names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["ACC", "Big 12", "Big Ten", "SEC"]

  /leagues:
    post:
      operationId: createLeague
      summary: Create a new league
      description: >
        Creates a league locked to the given conference/season_year for
        its lifetime (both immutable after creation) with a fresh unique
        invite_code, and — in the same transaction, with no separate join
        step — the requester's own league_memberships row as
        role=commissioner, is_contestant=true, status=active.
      tags:
        - Leagues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created; requester is its commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: Missing name, season_year out of range, or conference not recognized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMyLeagues
      summary: List leagues the requester belongs to
      description: >
        Leagues the requester has a non-removed membership in, each with
        their role/is_contestant/status in that league.
      tags:
        - Leagues
      responses:
        "200":
          description: The requester's leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLeague
      summary: Get league detail
      description: Requires a non-removed membership in the league (requireLeagueMember).
      tags:
        - Leagues
      responses:
        "200":
          description: League detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLeague
      summary: Update a league (commissioner only)
      description: >
        Requires the requester's membership in this league to have
        role=commissioner (requireCommissioner). `name` renames the
        league. `commissioner_is_contestant` updates *the commissioner's
        own* membership is_contestant flag — not a general member-editing
        mechanism. `conference` and `season_year` are immutable: including
        either key in the request body (even set to its current value) is
        rejected with 400.
      tags:
        - Leagues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueRequest"
      responses:
        "200":
          description: Updated league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: Empty name, invalid field type, or an attempt to change conference/season_year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the league's commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listLeagueMembers
      summary: List a league's non-removed members
      description: Requires a non-removed membership in the league (requireLeagueMember). Never exposes other members' emails.
      tags:
        - Leagues
      responses:
        "200":
          description: The league's active (non-removed) members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/leaderboard:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLeagueLeaderboard
      summary: Get a league's standings
      description: >
        Requires a non-removed membership in the league (requireLeagueMember).
        Returns every non-removed membership (contestants and manage-only
        commissioners alike) in standings order: active members first, then
        eliminated members ordered by eliminated_week_id descending (later
        elimination = survived longer = ranks higher among the eliminated).
        `bought_back` reflects the member's one-time-ever buy-back history
        (see POST /leagues/{id}/members/{membershipId}/buyback) — a
        reinstated member ranks among the active group, with
        `bought_back=true`.
      tags:
        - Leagues
      responses:
        "200":
          description: The league's standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/members/{membershipId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeLeagueMember
      summary: Remove a member from a league (commissioner only)
      description: >
        Requires role=commissioner (requireCommissioner). Soft-delete:
        sets removed_at on the membership row rather than deleting it
        (picks FK to league_membership_id in later phases). The removed
        member can rejoin later via the invite code — see
        POST /invites/{code}/join.
      tags:
        - Leagues
      responses:
        "204":
          description: Member removed
        "400":
          description: membershipId does not resolve to a currently-active member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the league's commissioner, or attempting to remove the commissioner's own membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/members/{membershipId}/buyback:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: buyBackLeagueMember
      summary: Reinstate an eliminated member (commissioner only, one-time-ever)
      description: >
        Requires role=commissioner (requireCommissioner). Reinstates an
        eliminated member: sets status='active', bought_back=true,
        bought_back_at=now(), bought_back_by=<the commissioner's user id>,
        all in one update. eliminated_week_id/eliminated_game_id are left
        untouched — they remain the historical record of the elimination
        that was bought back, not cleared. This is a one-time-ever lifeline
        per member: once bought_back is true it can never be used again,
        even after a later re-elimination (checked against the bought_back
        flag itself, not current status). Previously-used teams stay
        locked after reinstatement — enforced by the same
        UNIQUE(league_membership_id, team_id) constraint picks already
        rely on, no special-casing needed. Writes an audit_log row
        (action=buyback).
      tags:
        - Leagues
      responses:
        "200":
          description: The reinstated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          description: >
            membershipId does not resolve to a currently-active member of
            this league, or the member's current status is not
            'eliminated' (still active, or never eliminated) — nothing to
            buy back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the league's commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This member has already used their one-time buy-back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/members/{membershipId}/picks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMembershipPicks
      summary: One member's full-season pick history (the leaderboard's expandable card)
      description: >
        Requires league membership (requireLeagueMember). Returns every
        week of the league's season for membershipId, in week order,
        whether or not they picked each week — has_picked is false and
        every other field is absent for a week with no pick. Privacy rule:
        identical to GET /leagues/{id}/weeks/{weekId}/picks, just applied
        across a season of weeks for one membership instead of one week
        for every membership — the requester's own membership always shows
        full pick detail (team, opponent, home/away, kickoff, result);
        another member's pick shows full detail only once its game has
        kicked off, otherwise only has_picked/is_locked.
      tags:
        - Leagues
      responses:
        "200":
          description: The membership's pick history, one entry per week of the season
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipWeekPick"
        "400":
          description: membershipId does not resolve to a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/invite:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getInviteCode
      summary: Get a league's current invite code (commissioner only)
      description: Requires role=commissioner (requireCommissioner).
      tags:
        - Invites
      responses:
        "200":
          description: The league's current invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "403":
          description: Not the league's commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/invite/regenerate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: regenerateInviteCode
      summary: Regenerate a league's invite code (commissioner only)
      description: >
        Requires role=commissioner (requireCommissioner). Generates a
        fresh unique code and overwrites the stored one — the old code
        stops working immediately (it isn't a multi-valued list, just a
        single column).
      tags:
        - Invites
      responses:
        "200":
          description: The league's new invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "403":
          description: Not the league's commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/weeks/{weekId}/picks/me:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: weekId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMyPick
      summary: Get the requester's own pick for a week
      description: >
        Requires a non-removed membership in the league (requireLeagueMember).
        `locked` is computed live against the backing game's kickoff_at, not
        stored. 404 if the requester has no pick for this week yet.
      tags:
        - Picks
      responses:
        "200":
          description: The requester's pick for this week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pick"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League or week not found, or no pick submitted for this week yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertMyPick
      summary: Create or update the requester's pick for a week
      description: >
        Requires a non-removed, status=active membership in the league
        (requireLeagueMember, plus an explicit active-status check — a
        membership with status != active, e.g. a future eliminated member,
        cannot submit picks). Validated in order: game_id belongs to
        week_id (400); team_id is one of that game's two teams (400);
        team_id belongs to the league's locked conference (400); the
        target game itself must not have already kicked off, and if a pick
        already exists for this week its CURRENT game must not have
        already kicked off either (409, "already locked"). On success,
        upserts (creates or updates) the week's single pick row on
        (league_membership_id, week_id) — changing your mind before lock
        updates the same row rather than inserting a second one, which is
        what frees an abandoned team for a different week. A team already
        committed to a *different* week's pick row is rejected with a
        clean 409 rather than a raw database constraint error.
      tags:
        - Picks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPickRequest"
      responses:
        "200":
          description: The resulting pick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pick"
        "400":
          description: Invalid body, game does not belong to the week, team is not one of the game's two teams, or team is not in the league's conference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this league, or membership is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League or week not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The pick (or the target game) is already locked, or the team is
            already committed to a different week's pick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/weeks/{weekId}/available-teams:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: weekId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAvailableTeams
      summary: List pickable teams for a week
      description: >
        Requires a non-removed membership in the league (requireLeagueMember).
        Every team in the league's locked conference that has a game in the
        given week, each annotated with is_locked (that specific game has
        kicked off) and is_used_elsewhere (this team is already the
        requester's pick for a DIFFERENT week, regardless of that other
        pick's lock status). Also surfaces the requester's current pick for
        THIS week (if any) so the UI can render the current selection
        without a second round-trip.
      tags:
        - Picks
      responses:
        "200":
          description: This week's pickable teams, plus the requester's current pick for it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableTeamsResponse"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League or week not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/weeks/{weekId}/picks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: weekId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listWeekPicks
      summary: List every league member's pick status for a week
      description: >
        Requires a non-removed membership in the league (requireLeagueMember).
        Privacy rule: for every membership that is NOT the requester's own,
        game_id/team_id are included only once that pick's game has kicked
        off — omitted as a pair (never just team_id) while it hasn't, since
        revealing even which game a member is tied to narrows their choice
        to two teams. The requester's own entry always includes full detail
        when has_picked is true, regardless of lock status.
      tags:
        - Picks
      responses:
        "200":
          description: Every non-removed member's pick status for this week
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberPickStatus"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League or week not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{code}:
    parameters:
      - name: code
