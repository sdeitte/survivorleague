          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Requester already has an active (non-removed) membership in this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /weeks:
    get:
      operationId: listWeeks
      summary: List a season's weeks
