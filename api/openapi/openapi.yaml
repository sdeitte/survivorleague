openapi: 3.1.0
info:
  title: Survivor League API
  description: >
    REST API for the College Football Survivor Pool app. This spec is the
    source of truth for the shared TypeScript client generated into
    packages/api-client (consumed by both web and mobile).

    Phase 1 added auth (register/login/refresh/logout) and the current-user
    endpoints. Phase 2 added league CRUD, membership, the invite-code join
    flow, and the conferences list. Phase 3 adds read-only schedule
    endpoints (weeks/games/teams, populated by a CFBD sync) and the first
    site-admin endpoints (triggering/viewing that sync). Picks, leaderboard,
    and the rest of site-admin are added incrementally in later phases per
    the roadmap — see /Users/sdeitte/.claude/plans/witty-questing-barto.md.
  version: 0.3.0
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness check
      description: >
        Returns 200 with db=ok when the API can reach Postgres, or a 503
        with an error message otherwise.
      security: []
      tags:
        - System
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/register:
    post:
      operationId: registerUser
      summary: Create a new account and start a session
      description: >
        Validates email format and a minimum-8-character password, hashes
        the password with argon2id, and creates the user. If `email`
        case-insensitively matches the server's configured ADMIN_EMAIL, the
        new user is created with is_site_admin=true. On success, behaves
        exactly like POST /auth/login: an access token is returned in the
        body and a rotating refresh token is both set as an httpOnly cookie
        (used by the web client) and included in the body (used by the
        mobile client, which has no cookie jar to read Set-Cookie from).
        There is no email-verification gate in this phase.
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; session started
          headers:
            Set-Cookie:
              description: >
                Sets the `refresh_token` cookie (httpOnly, SameSite=Strict,
                Secure in production).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid email, weak password, or missing display_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate and start a session
      description: >
        Verifies the argon2id password hash. On success, issues a 15-minute
        JWT access token (HS256, claims include sub and is_site_admin) and
        a 30-day rotating refresh token — stored server-side as a SHA-256
        hash, set client-side as an httpOnly `refresh_token` cookie
        (SameSite=Strict, Secure in production) for web, and also returned
        in the body for mobile (no cookie jar to read Set-Cookie from).
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session started
          headers:
            Set-Cookie:
              description: Sets the `refresh_token` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and mint a new access token
      description: >
        Reads the refresh token from the `refresh_token` cookie if present,
        else from the JSON body (mobile has no cookie jar and sends it
        explicitly). The presented token must match a non-revoked,
        non-expired row; on success it is revoked (rotated) and a new
        access/refresh pair is issued and stored. Reusing an
        already-rotated, expired, or unknown token always fails with 401. A
        new `refresh_token` cookie is set regardless of caller type
        (harmless for mobile, required for web).
      security: []
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session refreshed
          headers:
            Set-Cookie:
              description: Sets the new `refresh_token` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Missing, invalid, expired, or already-used refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      summary: End the current session
      description: >
        Reads the refresh token the same dual cookie/body way as
        POST /auth/refresh and revokes it (a missing/unknown token is a
        no-op, not an error). Clears the `refresh_token` cookie.
      security: []
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Session ended
          headers:
            Set-Cookie:
              description: Clears the `refresh_token` cookie.
              schema:
                type: string

  /me:
    get:
      operationId: getMe
      summary: Get the current user
      tags:
        - Users
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      summary: Update the current user's profile
      description: Only display_name is editable in this phase.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing display_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conferences:
    get:
      operationId: listConferences
      summary: List the canonical FBS conferences leagues can be created for
      description: >
        Returns the hardcoded, stable list of FBS conference names (see
        internal/schedule/conferences.go) that POST /leagues validates its
        `conference` field against. This is deliberately not sourced from
        `teams.conference` (which is empty until Phase 3's CFBD sync runs)
        — league creation must not depend on schedule data that doesn't
        exist yet.
      security: []
      tags:
        - Conferences
      responses:
        "200":
          description: The canonical FBS conference names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["ACC", "Big 12", "Big Ten", "SEC"]

  /leagues:
    post:
      operationId: createLeague
      summary: Create a new league
      description: >
        Creates a league locked to the given conference/season_year for
        its lifetime (both immutable after creation) with a fresh unique
        invite_code, and — in the same transaction, with no separate join
        step — the requester's own league_memberships row as
        role=commissioner, is_contestant=true, status=active.
      tags:
        - Leagues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created; requester is its commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: Missing name, season_year out of range, or conference not recognized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMyLeagues
      summary: List leagues the requester belongs to
      description: >
        Leagues the requester has a non-removed membership in, each with
        their role/is_contestant/status in that league.
      tags:
        - Leagues
      responses:
        "200":
          description: The requester's leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLeague
      summary: Get league detail
      description: Requires a non-removed membership in the league (requireLeagueMember).
      tags:
        - Leagues
      responses:
        "200":
          description: League detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLeague
      summary: Update a league (commissioner only)
      description: >
        Requires the requester's membership in this league to have
        role=commissioner (requireCommissioner). `name` renames the
        league. `commissioner_is_contestant` updates *the commissioner's
        own* membership is_contestant flag — not a general member-editing
        mechanism. `conference` and `season_year` are immutable: including
        either key in the request body (even set to its current value) is
        rejected with 400.
      tags:
        - Leagues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueRequest"
      responses:
        "200":
          description: Updated league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: Empty name, invalid field type, or an attempt to change conference/season_year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the league's commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listLeagueMembers
      summary: List a league's non-removed members
      description: Requires a non-removed membership in the league (requireLeagueMember). Never exposes other members' emails.
      tags:
        - Leagues
      responses:
        "200":
          description: The league's active (non-removed) members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "403":
          description: Not a member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/members/{membershipId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeLeagueMember
      summary: Remove a member from a league (commissioner only)
      description: >
        Requires role=commissioner (requireCommissioner). Soft-delete:
        sets removed_at on the membership row rather than deleting it
        (picks FK to league_membership_id in later phases). The removed
        member can rejoin later via the invite code — see
        POST /invites/{code}/join.
      tags:
        - Leagues
      responses:
        "204":
          description: Member removed
        "400":
          description: membershipId does not resolve to a currently-active member of this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the league's commissioner, or attempting to remove the commissioner's own membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/invite:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getInviteCode
      summary: Get a league's current invite code (commissioner only)
      description: Requires role=commissioner (requireCommissioner).
      tags:
        - Invites
      responses:
        "200":
          description: The league's current invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "403":
          description: Not the league's commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}/invite/regenerate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: regenerateInviteCode
      summary: Regenerate a league's invite code (commissioner only)
      description: >
        Requires role=commissioner (requireCommissioner). Generates a
        fresh unique code and overwrites the stored one — the old code
        stops working immediately (it isn't a multi-valued list, just a
        single column).
      tags:
        - Invites
      responses:
        "200":
          description: The league's new invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "403":
          description: Not the league's commissioner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: previewInvite
      summary: Preview a league by invite code
      description: >
        Public — lets someone see what league they're being invited to
        before registering or logging in.
      security: []
      tags:
        - Invites
      responses:
        "200":
          description: The invited league's public preview info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreviewResponse"
        "404":
          description: Invite code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{code}/join:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: joinLeagueByCode
      summary: Join a league via its invite code
      description: >
        Creates an active role=player, is_contestant=true membership for
        the requester. If the requester's only prior membership in this
        league was removed by the commissioner (removed_at set), this
        reactivates that same row as a fresh active membership rather
        than erroring on the underlying UNIQUE(league_id, user_id)
        constraint — rejoining after removal is explicitly supported.
      tags:
        - Invites
      responses:
        "200":
          description: Joined (or rejoined) the league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Requester already has an active (non-removed) membership in this league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /weeks:
    get:
      operationId: listWeeks
      summary: List a season's weeks
      description: >
        Weeks are global per season (shared across every league, not
        conference-scoped) — populated by the CFBD schedule sync
        (POST /admin/sync/schedule), regular season only.
      tags:
        - Schedule
      parameters:
        - name: season_year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The season's weeks, ordered by week_number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Week"
        "400":
          description: Missing or non-integer season_year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /weeks/{id}/games:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listWeekGames
      summary: List a week's games
      description: >
        Includes both teams' name/conference/logo inline so clients don't
        need N+1 lookups to render a picks screen.
      tags:
        - Schedule
      responses:
        "200":
          description: The week's games, ordered by kickoff_at
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Week not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getGame
      summary: Get a single game's detail
      tags:
        - Schedule
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teams:
    get:
      operationId: listTeams
      summary: List FBS teams
      description: >
        Populated by the CFBD schedule sync. `conference` filters to an
        exact (case-sensitive) match against the canonical FBS conference
        names (see GET /conferences); omit it to list every FBS team across
        every conference.
      tags:
        - Schedule
      parameters:
        - name: conference
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Teams matching the filter, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/sync/schedule:
    post:
      operationId: triggerScheduleSync
      summary: Manually trigger a CFBD schedule sync (site admin only)
      description: >
        Requires is_site_admin=true (requireSiteAdmin). Runs synchronously:
        pulls FBS teams, the regular-season calendar, and regular-season
        games for `season_year` from CollegeFootballData.com and
        idempotently upserts teams/weeks/games. Always records a
        `sync_runs` row (whether the CFBD call succeeds or fails) and, on
        success, an `audit_log` row (action=schedule_sync). This endpoint
        is additive to the daily cron sync in cmd/server, not a replacement
        for it.
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerScheduleSyncRequest"
      responses:
        "200":
          description: >
            The sync_runs record for this run. status=success or
            status=failed (see the `error` field) — a failed CFBD call
            still returns 200 with the recorded failure, since the admin
            action itself (recording the attempt) succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRun"
        "400":
          description: Missing or out-of-range season_year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/sync/runs:
    get:
      operationId: listSyncRuns
      summary: List recent sync runs (site admin only)
      description: Requires is_site_admin=true (requireSiteAdmin). Newest first.
      tags:
        - Admin
      responses:
        "200":
          description: Recent sync runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRun"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: string
          enum: [ok, error]
        error:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      description: >
        Only used by clients without a cookie jar (mobile). Web clients
        rely on the httpOnly cookie and may send an empty body.
      properties:
        refresh_token:
          type: string

    UpdateMeRequest:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string

    User:
      type: object
      required:
        - id
        - email
        - display_name
        - is_site_admin
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_site_admin:
          type: boolean

    SessionResponse:
      type: object
      required:
        - access_token
        - user
      properties:
        access_token:
          type: string
          description: 15-minute JWT (HS256).
        refresh_token:
          type: string
          description: >
            Present on all three token-issuing endpoints. Web clients
            ignore this field and rely on the httpOnly cookie (also always
            set); mobile clients, which have no cookie jar, read it from
            here and store it via expo-secure-store.
        user:
          $ref: "#/components/schemas/User"

    CreateLeagueRequest:
      type: object
      required:
        - name
        - season_year
        - conference
      properties:
        name:
          type: string
        season_year:
          type: integer
          minimum: 2000
          maximum: 2100
        conference:
          type: string
          description: Must exactly (case-sensitive) match one of the names returned by GET /conferences.

    UpdateLeagueRequest:
      type: object
      description: >
        conference/season_year are deliberately absent from this schema —
        both are immutable, and including either key in the request body
        at all (regardless of value) is rejected with 400.
      properties:
        name:
          type: string
        commissioner_is_contestant:
          type: boolean
          description: Updates the *acting commissioner's own* membership is_contestant flag only.

    MembershipSummary:
      type: object
      description: The requester's own role/status within a league.
      required:
        - id
        - role
        - is_contestant
        - status
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [commissioner, player]
        is_contestant:
          type: boolean
        status:
          type: string
          enum: [active, eliminated]

    League:
      type: object
      description: >
        Returned by every endpoint that hands back a league together with
        the requester's membership in it (create, list, get, update,
        join). Deliberately omits invite_code — that's only exposed via
        GET/POST /leagues/{id}/invite....
      required:
        - id
        - name
        - season_year
        - conference
        - commissioner_user_id
        - status
        - created_at
        - membership
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        season_year:
          type: integer
        conference:
          type: string
        commissioner_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active]
        created_at:
          type: string
          format: date-time
        membership:
          $ref: "#/components/schemas/MembershipSummary"

    Member:
      type: object
      required:
        - membership_id
        - user_id
        - display_name
        - role
        - is_contestant
        - status
        - joined_at
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [commissioner, player]
        is_contestant:
          type: boolean
        status:
          type: string
          enum: [active, eliminated]
        joined_at:
          type: string
          format: date-time

    InviteCodeResponse:
      type: object
      required:
        - invite_code
      properties:
        invite_code:
          type: string

    InvitePreviewResponse:
      type: object
      required:
        - league_name
        - conference
        - season_year
      properties:
        league_name:
          type: string
        conference:
          type: string
        season_year:
          type: integer

    Team:
      type: object
      required:
        - id
        - external_id
        - name
        - conference
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
          description: CFBD's team id, stored as-is (no id-mangling).
        name:
          type: string
        conference:
          type: string
          description: >
            The *normalized* conference name (see
            internal/schedule/conferences.go) — always one of the canonical
            names returned by GET /conferences, never CFBD's raw string.
        logo_url:
          type: string

    Week:
      type: object
      required:
        - id
        - season_year
        - week_number
      properties:
        id:
          type: string
          format: uuid
        season_year:
          type: integer
        week_number:
          type: integer

    GameTeam:
      type: object
      description: A game's home or away team, trimmed for inline embedding.
      required:
        - id
        - name
        - conference
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        conference:
          type: string
        logo_url:
          type: string

    Game:
      type: object
      required:
        - id
        - external_id
        - week_id
        - kickoff_at
        - status
        - home_team
        - away_team
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
          description: CFBD's game id, stored as-is.
        week_id:
          type: string
          format: uuid
        kickoff_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, in_progress, final, postponed, canceled]
        home_team:
          $ref: "#/components/schemas/GameTeam"
        away_team:
          $ref: "#/components/schemas/GameTeam"
        home_score:
          type: integer
        away_score:
          type: integer
        winner_team_id:
          type: string
          format: uuid

    TriggerScheduleSyncRequest:
      type: object
      required:
        - season_year
      properties:
        season_year:
          type: integer
          minimum: 2000
          maximum: 2100
          description: No implicit default — the admin must always specify which season to sync.

    SyncRun:
      type: object
      description: >
        A single schedule-sync attempt (manual or cron-triggered).
        `details` carries trigger/triggered_by/season_year and, once
        finished, the sync result counts (teams/weeks/games
        upserted/skipped) — see internal/admin/service.go's syncRunDetails.
      required:
        - id
        - kind
        - status
        - started_at
        - details
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [schedule]
        status:
          type: string
          enum: [running, success, failed]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          type: string
        details:
          type: object
        created_at:
          type: string
          format: date-time
