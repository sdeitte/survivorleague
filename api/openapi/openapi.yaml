      operationId: disableUser
      summary: Disable a user's account (site admin only)
      description: >
        Requires is_site_admin=true (requireSiteAdmin). Sets the target
        user's status to 'disabled', which rejects their next login attempt
        (internal/auth.Service.Login checks status != 'active'); an
        already-issued access token stays valid until its own 15-minute
        expiry. Writes an audit_log row (action=disable_user). Rejects with
        403 if the target id is the acting admin's own id — a site admin
        cannot disable their own account.
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin, or attempting to disable your own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/enable:
    post:
      operationId: enableUser
      summary: Re-enable a previously-disabled user's account (site admin only)
      description: >
        Requires is_site_admin=true (requireSiteAdmin). The symmetric undo
        of POST /admin/users/{id}/disable — sets status back to 'active'.
        Writes an audit_log row (action=enable_user).
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/games/{id}/resync:
    post:
      operationId: resyncGame
      summary: Re-fetch a single game from CFBD and upsert it (site admin only)
      description: >
        Requires is_site_admin=true (requireSiteAdmin). The direct unblock
        mechanism for a game whose status is stuck postponed/canceled/stale
        in a way that's blocking grading finalization for any league that
        has it in a relevant week (see the grading pipeline's "Postponed/
        canceled games are left ungraded and surfaced to admins" rule).
        Re-fetches this game (by its games.id, not its CFBD external_id)
        from CollegeFootballData.com and upserts it. If the upserted game's
        status is now 'final', this triggers the same grading path the live
        poll loop uses (GradeGame, then TryFinalizeLeagueWeek for every
        league with picks in that week) and reports which league-weeks (if
        any) actually finalized as a result. Always writes an audit_log row
        (action=resync_game) once the game itself has been upserted.
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated game, plus any league-weeks finalized as a result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResyncGameResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            CFBD no longer reports a game with this external_id for its
            season/week (a CFBD-side data issue, not something a resync can
            resolve)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/audit-log:
    get:
      operationId: listAuditLog
      summary: List audit log entries (site admin only)
      description: >
        Requires is_site_admin=true (requireSiteAdmin). Newest first.
        action/actor_user_id are optional equality filters.
      tags:
        - Admin
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Exact-match filter on the action name (e.g. "resync_game")
        - name: actor_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated list of audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "400":
          description: actor_user_id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a site admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: >
        Max rows to return. Out-of-range values are clamped (not rejected)
        server-side.
    PageOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: string
          enum: [ok, error]
        error:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      description: >
        Only used by clients without a cookie jar (mobile). Web clients
        rely on the httpOnly cookie and may send an empty body.
      properties:
        refresh_token:
          type: string

    UpdateMeRequest:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string

    User:
      type: object
      required:
        - id
        - email
        - display_name
        - is_site_admin
        - email_verified_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_site_admin:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Post-Phase-10 addition. Null until POST /auth/verify-email
            succeeds for this user. Always present (never omitted) so a
            client can reliably branch on `email_verified_at === null` to
            show a verify-email prompt. NOT a login gate — an unverified
            user can fully use the app.

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    MessageResponse:
      type: object
      description: >
        A generic human-readable confirmation. Used by
        forgot-password/reset-password/verify-email/resend-verification —
        forgot-password's found and not-found cases deliberately return
        the exact same message text, not just the same schema.
      required:
        - message
      properties:
        message:
          type: string

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    RegisterDeviceTokenRequest:
      type: object
      required:
        - platform
        - expo_push_token
      properties:
        platform:
          type: string
          enum: [ios, android]
        expo_push_token:
          type: string

    DeleteDeviceTokenRequest:
      type: object
      required:
        - expo_push_token
      properties:
        expo_push_token:
          type: string

    DeviceToken:
      type: object
      required:
        - id
        - platform
        - created_at
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, android]
        created_at:
          type: string
          format: date-time

    NotificationPreferences:
      type: object
      description: >
        One boolean per trigger type plus one per delivery channel. All
        default true (see notification_preferences' column defaults in
        migrations/00001_init.sql) — every type is effectively opt-out,
        `survived` (push-only) is simply the one the plan calls out by
        name as opt-out framing.
      required:
        - pick_reminder
        - eliminated
        - survived
        - mass_wipeout
        - buyback
        - email_enabled
        - push_enabled
      properties:
        pick_reminder:
          type: boolean
        eliminated:
          type: boolean
        survived:
          type: boolean
        mass_wipeout:
          type: boolean
        buyback:
          type: boolean
        email_enabled:
          type: boolean
        push_enabled:
          type: boolean

    SessionResponse:
      type: object
      required:
        - access_token
        - user
      properties:
        access_token:
          type: string
          description: 15-minute JWT (HS256).
        refresh_token:
          type: string
          description: >
            Present on all three token-issuing endpoints. Web clients
            ignore this field and rely on the httpOnly cookie (also always
            set); mobile clients, which have no cookie jar, read it from
            here and store it via expo-secure-store.
        user:
          $ref: "#/components/schemas/User"

    CreateLeagueRequest:
      type: object
      required:
        - name
        - season_year
        - conference
      properties:
        name:
          type: string
        season_year:
          type: integer
          minimum: 2000
          maximum: 2100
        conference:
          type: string
          description: Must exactly (case-sensitive) match one of the names returned by GET /conferences.

    UpdateLeagueRequest:
      type: object
      description: >
        conference/season_year are deliberately absent from this schema —
        both are immutable, and including either key in the request body
        at all (regardless of value) is rejected with 400.
      properties:
        name:
          type: string
        commissioner_is_contestant:
          type: boolean
          description: Updates the *acting commissioner's own* membership is_contestant flag only.

    MembershipSummary:
      type: object
      description: The requester's own role/status within a league.
      required:
        - id
        - role
        - is_contestant
        - status
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [commissioner, player]
        is_contestant:
          type: boolean
        status:
          type: string
          enum: [active, eliminated]

    League:
      type: object
      description: >
        Returned by every endpoint that hands back a league together with
        the requester's membership in it (create, list, get, update,
        join). Deliberately omits invite_code — that's only exposed via
        GET/POST /leagues/{id}/invite....
      required:
        - id
        - name
        - season_year
        - conference
        - commissioner_user_id
        - status
        - created_at
        - membership
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        season_year:
          type: integer
        conference:
          type: string
        commissioner_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active]
        created_at:
          type: string
          format: date-time
        membership:
          $ref: "#/components/schemas/MembershipSummary"

    Member:
      type: object
      required:
        - membership_id
        - user_id
        - display_name
        - role
        - is_contestant
        - status
        - bought_back
        - joined_at
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [commissioner, player]
        is_contestant:
          type: boolean
        status:
          type: string
          enum: [active, eliminated]
        bought_back:
          type: boolean
          description: >
            True if this member has already used their one-time-ever
            buy-back (see POST .../buyback) — commissioners should hide or
            disable a buy-back action for such a member rather than let
            them attempt (and get 409'd on) a second one.
        joined_at:
          type: string
          format: date-time

    Membership:
      type: object
      description: >
        The full membership record — richer than the trimmed Member/
        MembershipSummary shapes used elsewhere, since a buy-back response
        needs to surface the fields it just changed (and, for
        eliminated_week_id/eliminated_game_id, deliberately did not
        change). Returned by POST .../members/{membershipId}/buyback.
      required:
        - membership_id
        - league_id
        - user_id
        - role
        - is_contestant
        - status
        - bought_back
      properties:
        membership_id:
          type: string
          format: uuid
        league_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [commissioner, player]
        is_contestant:
          type: boolean
        status:
          type: string
          enum: [active, eliminated]
        eliminated_week_id:
          type: string
          format: uuid
          description: Present only when status=eliminated, or a past elimination was bought back.
        eliminated_game_id:
          type: string
          format: uuid
          description: Present only when the elimination (past or current) was via a losing pick, not a missed pick.
        bought_back:
          type: boolean
        bought_back_at:
          type: string
          format: date-time
        bought_back_by:
          type: string
          format: uuid
          description: The commissioner user id who granted the buy-back.

    LeaderboardEntry:
      type: object
      description: >
        One membership's row in a league's standings — see
        GET /leagues/{id}/leaderboard's description for the sort contract.
      required:
        - membership_id
        - display_name
        - status
        - is_contestant
        - bought_back
      properties:
        membership_id:
          type: string
          format: uuid
        display_name:
          type: string
        status:
          type: string
          enum: [active, eliminated]
        is_contestant:
          type: boolean
        eliminated_week_id:
          type: string
          format: uuid
          description: Present only when status=eliminated.
        bought_back:
          type: boolean
          description: Always false until Phase 6 (buy-back) is built.

    InviteCodeResponse:
      type: object
      required:
        - invite_code
      properties:
        invite_code:
          type: string

    InvitePreviewResponse:
      type: object
      required:
        - league_name
        - conference
        - season_year
      properties:
        league_name:
          type: string
        conference:
          type: string
        season_year:
          type: integer

    Team:
      type: object
      required:
        - id
        - external_id
        - name
        - conference
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
          description: CFBD's team id, stored as-is (no id-mangling).
        name:
          type: string
        conference:
          type: string
          description: >
            The *normalized* conference name (see
            internal/schedule/conferences.go) — always one of the canonical
            names returned by GET /conferences, never CFBD's raw string.
        logo_url:
          type: string

    Week:
      type: object
      required:
        - id
        - season_year
        - week_number
      properties:
        id:
          type: string
          format: uuid
        season_year:
          type: integer
        week_number:
          type: integer

    GameTeam:
      type: object
      description: A game's home or away team, trimmed for inline embedding.
      required:
        - id
        - name
        - conference
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        conference:
          type: string
        logo_url:
          type: string

    Game:
      type: object
      required:
        - id
        - external_id
        - week_id
        - kickoff_at
        - status
        - home_team
        - away_team
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
          description: CFBD's game id, stored as-is.
        week_id:
          type: string
          format: uuid
        kickoff_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, in_progress, final, postponed, canceled]
        home_team:
          $ref: "#/components/schemas/GameTeam"
        away_team:
          $ref: "#/components/schemas/GameTeam"
        home_score:
          type: integer
        away_score:
          type: integer
        winner_team_id:
          type: string
          format: uuid

    Pick:
      type: object
      description: A single week's pick. `locked` is computed live against the backing game's kickoff_at, not stored.
      required:
        - game_id
        - team_id
        - locked
      properties:
        game_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        locked:
          type: boolean

    UpsertPickRequest:
      type: object
      required:
        - game_id
        - team_id
      properties:
        game_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid

    AvailableTeam:
      type: object
      description: One pickable team for a week, with its opponent/game inline so the picks screen doesn't need N+1 lookups.
      required:
        - team_id
        - team_name
        - opponent_team_id
        - opponent_name
        - game_id
        - kickoff_at
        - is_home
        - is_locked
        - is_used_elsewhere
        - is_current_pick
      properties:
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        team_logo_url:
          type: string
        opponent_team_id:
          type: string
          format: uuid
        opponent_name:
          type: string
        opponent_logo_url:
          type: string
        game_id:
          type: string
          format: uuid
        kickoff_at:
          type: string
          format: date-time
        is_home:
          type: boolean
          description: True if this team is the home team in this game.
        is_locked:
          type: boolean
          description: This team's game has already kicked off.
        is_used_elsewhere:
          type: boolean
          description: This team is already the requester's pick for a DIFFERENT week (regardless of that pick's lock status).
        is_current_pick:
          type: boolean
          description: This team is the requester's current pick for THIS week.

    AvailableTeamsResponse:
      type: object
      required:
        - teams
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/AvailableTeam"
        current_pick:
          $ref: "#/components/schemas/Pick"
          description: The requester's current pick for this week, if any (absent if they haven't picked yet).

    MemberPickStatus:
      type: object
      description: >
        A league member's pick status for a week. game_id/team_id are only
        present when the caller is entitled to see them — see
        GET /leagues/{id}/weeks/{weekId}/picks's privacy-rule description.
      required:
        - membership_id
        - display_name
        - has_picked
      properties:
        membership_id:
          type: string
          format: uuid
        display_name:
          type: string
        has_picked:
          type: boolean
        game_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid

    MembershipWeekPick:
      type: object
      description: >
        One week of a membership's season, for GET
        /leagues/{id}/members/{membershipId}/picks. Pick-identifying
        fields (game_id, team_id, team_name, team_logo_url, opponent_name,
        opponent_logo_url, is_home, kickoff_at, result) are present only
        when the caller is entitled to see them — see the endpoint's
        privacy-rule description. They're omitted together as a bundle,
        not just team_id, so a not-yet-revealed pick never leaks even
        indirectly (e.g. via kickoff_at narrowing which game it was).
      required:
        - week_number
        - has_picked
        - is_locked
      properties:
        week_number:
          type: integer
        has_picked:
          type: boolean
        is_locked:
          type: boolean
          description: This pick's game has already kicked off (false, and no pick-identifying fields, for a week with no pick).
        game_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        team_logo_url:
          type: string
        opponent_name:
          type: string
        opponent_logo_url:
          type: string
        is_home:
          type: boolean
        kickoff_at:
          type: string
          format: date-time
        result:
          type: string
          enum: [pending, win, loss, void]

    TriggerScheduleSyncRequest:
      type: object
      required:
        - season_year
      properties:
        season_year:
          type: integer
          minimum: 2000
          maximum: 2100
          description: No implicit default — the admin must always specify which season to sync.

    SyncRun:
      type: object
      description: >
        A single schedule-sync attempt (manual or cron-triggered).
        `details` carries trigger/triggered_by/season_year and, once
        finished, the sync result counts (teams/weeks/games
        upserted/skipped) — see internal/admin/service.go's syncRunDetails.
      required:
        - id
        - kind
        - status
        - started_at
        - details
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [schedule]
        status:
          type: string
          enum: [running, success, failed]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          type: string
        details:
          type: object
        created_at:
          type: string
          format: date-time

    AdminCommissioner:
      type: object
      description: Trimmed commissioner identity embedded in AdminLeague.
      required:
        - id
        - display_name
        - email
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email

    AdminLeague:
      type: object
      description: >
        One row of GET /admin/leagues — every league in the system, unlike
        League (which always carries the requester's own membership; this
        never does, since a site admin need not be a member).
      required:
        - id
        - name
        - conference
        - season_year
        - status
        - commissioner
        - member_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        conference:
          type: string
        season_year:
          type: integer
        status:
          type: string
          enum: [active]
        commissioner:
          $ref: "#/components/schemas/AdminCommissioner"
        member_count:
          type: integer
          description: Count of non-removed league_memberships rows.
        created_at:
          type: string
          format: date-time

    AdminLeaguesListResponse:
      type: object
      required:
        - leagues
        - total
        - limit
        - offset
      properties:
        leagues:
          type: array
          items:
            $ref: "#/components/schemas/AdminLeague"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    AdminUser:
      type: object
      description: One row of GET /admin/users — every user in the system.
      required:
        - id
        - email
        - display_name
        - is_site_admin
        - status
        - league_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_site_admin:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        league_count:
          type: integer
          description: Count of non-removed league_memberships rows for this user.
        created_at:
          type: string
          format: date-time

    AdminUsersListResponse:
      type: object
      required:
        - users
        - total
        - limit
        - offset
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    AdminUserDetail:
      type: object
      description: >
        Response of POST /admin/users/{id}/disable and .../enable — the
        updated user record in full.
      required:
        - id
        - email
        - display_name
        - is_site_admin
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_site_admin:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time

    FinalizedLeagueWeek:
      type: object
      description: >
        One league-week that a game resync's downstream grading pass
        actually finalized.
      required:
        - league_id
        - week_id
        - mass_wipeout
      properties:
        league_id:
          type: string
          format: uuid
        week_id:
          type: string
          format: uuid
        mass_wipeout:
          type: boolean

    ResyncGameResponse:
      type: object
      required:
        - game
        - finalized_league_weeks
      properties:
        game:
          $ref: "#/components/schemas/Game"
          description: >
            home_team/away_team here carry only `id` (name/conference/
            logo_url are empty strings) — a resync response's caller
            already knows which teams are playing; follow up with
            GET /games/{id} for the fully joined shape.
        finalized_league_weeks:
          type: array
          items:
            $ref: "#/components/schemas/FinalizedLeagueWeek"
          description: >
            Empty if the resynced game isn't status=final, or is final but
            no league-week was ready to finalize yet.

    AuditLogEntry:
      type: object
      required:
        - id
        - action
        - metadata
        - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
          description: Absent for a system-triggered action with no acting user (e.g. the cron schedule sync).
        league_id:
          type: string
          format: uuid
          description: Present only for a league-scoped action (e.g. buyback).
        action:
          type: string
          description: 'e.g. schedule_sync, buyback, disable_user, enable_user, resync_game'
        target_type:
          type: string
          description: 'e.g. user, game, sync_run, league_membership'
        target_id:
          type: string
          format: uuid
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      required:
        - entries
        - total
        - limit
        - offset
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
