services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: survivor
      POSTGRES_PASSWORD: survivor
      POSTGRES_DB: survivor_league
    ports:
      - "5432:5432"
    volumes:
      - survivor-league-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survivor -d survivor_league"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  survivor-league-postgres-data:
