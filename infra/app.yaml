# DigitalOcean App Platform spec.
#
# This is a CONFIG FILE, not a deployment action. No `doctl` command has
# been run against it and no real DO resources exist yet — see
# infra/LAUNCH_CHECKLIST.md and the deployment plan for the actual
# sequencing (Postgres provisioned + migrated *before* the first
# `doctl apps create` against this spec).
#
# Postgres is NOT declared here — per the plan's Hosting section, it's
# provisioned separately as a DO Managed PostgreSQL database resource
# (not an App Platform component) and wired in via the DATABASE_URL
# secret reference below.
#
# All ${...} values are placeholder secret references, not real
# credentials — App Platform resolves `${VAR}`-style bindings against
# encrypted secrets configured in the app/component settings, either via
# `doctl apps update` / the control panel, or a separate (untracked)
# secrets file passed at deploy time. Nothing here is a live value.

name: survivor-league
region: nyc

services:
  - name: api
    github:
      repo: sdeitte/survivorleague
      branch: main
      deploy_on_push: true
    source_dir: api
    # Relative to the REPO ROOT, not source_dir (confirmed empirically —
    # an earlier attempt to "fix" this to a source_dir-relative path was
    # itself a misdiagnosis: the actual failure at the time was that
    # api/Dockerfile hadn't been pushed to GitHub yet, not a wrong path).
    dockerfile_path: api/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # Mounted at /api on the app's shared default domain (App Platform
    # strips this prefix before forwarding to the container by default, so
    # the Go router's own routes stay unprefixed — e.g. a request to
    # /api/health reaches this service as /health). Two components can't
    # both claim path "/" under one app's default ingress, which is what
    # this originally did before being caught by `doctl apps spec
    # validate`. Bonus: since web and api now share one domain (just
    # different paths), API calls from the web app are same-origin, not
    # cross-origin — simpler and more reliable than the two-separate-
    # hostnames shape this originally implied, especially for the
    # Secure/credentialed refresh-token cookie.
    routes:
      - path: /api
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: ${survivor-league-db.DATABASE_URL}
        type: SECRET
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        type: SECRET
      - key: APP_ENV
        value: production
      - key: ADMIN_EMAIL
        value: ${ADMIN_EMAIL}
        type: SECRET
      - key: CORS_ALLOWED_ORIGIN
        value: ${web.PUBLIC_URL}
      # Frontend origin used to build password-reset/email-verification/
      # league-invite links (see api/cmd/server/main.go's WEB_BASE_URL
      # handling). Defaults to http://localhost:5173 if unset — must be
      # the real custom domain, not web.PUBLIC_URL's *.ondigitalocean.app
      # value, since that's what recipients actually click.
      - key: WEB_BASE_URL
        value: https://survivorleague.football
      - key: CFBD_API_KEY
        value: ${CFBD_API_KEY}
        type: SECRET
      - key: RESEND_API_KEY
        value: ${RESEND_API_KEY}
        type: SECRET
      - key: RESEND_FROM_EMAIL
        value: ${RESEND_FROM_EMAIL}
        type: SECRET
      - key: EXPO_ACCESS_TOKEN
        value: ${EXPO_ACCESS_TOKEN}
        type: SECRET

static_sites:
  - name: web
    github:
      repo: sdeitte/survivorleague
      branch: main
      deploy_on_push: true
    source_dir: web
    build_command: npm ci && npm run build
    output_dir: dist
    # Without this, direct navigation to a client-side route (e.g. the
    # /verify-email?token=... link from a real email, not a link clicked
    # from within the already-loaded app) 404s: App Platform's static file
    # server has no literal /verify-email file to serve, and by default
    # returns a real 404 instead of falling back to the SPA's index.html.
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_BASE_URL
        value: ${api.PUBLIC_URL}

# Managed database (referenced above via ${survivor-league-db.DATABASE_URL}):
# provisioned as a separate DO Managed PostgreSQL resource (`doctl databases
# create`), NOT as an App Platform "databases:" component tied to this app's
# lifecycle — keeps the DB alive independently of app redeploys/teardowns.
# Example (not executed by this scaffold):
#   doctl databases create survivor-league-db --engine pg --version 16 \
#     --region nyc --size db-s-1vcpu-1gb
