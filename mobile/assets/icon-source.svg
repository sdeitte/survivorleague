<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Survivor League Football Icon</title>
  <desc id="desc">Black football emblem with red accents on a black square background.</desc>
  <defs>
    <radialGradient id="ballShade" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1b1b1b"/>
      <stop offset="65%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2a22"/>
      <stop offset="55%" stop-color="#b30c0c"/>
      <stop offset="100%" stop-color="#670000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1600" fill="#b30c0c"/>

  <g transform="translate(0,350)" filter="url(#shadow)">
    <!-- Football -->
    <path d="M85 450 C255 145 540 70 800 70 C1060 70 1345 145 1515 450 C1345 755 1060 830 800 830 C540 830 255 755 85 450 Z"
          fill="url(#ballShade)" stroke="#454545" stroke-width="10"/>
    <path d="M120 450 C285 190 550 115 800 115 C1050 115 1315 190 1480 450 C1315 710 1050 785 800 785 C550 785 285 710 120 450 Z"
          fill="none" stroke="#9b0000" stroke-width="8"/>
    <path d="M155 450 C310 225 565 155 800 155 C1035 155 1290 225 1445 450"
          fill="none" stroke="#2d2d2d" stroke-width="6"/>

    <!-- Side panel accents -->
    <path d="M180 445 L290 270 L235 405 Z" fill="url(#redGrad)"/>
    <path d="M1420 445 L1310 270 L1365 405 Z" fill="url(#redGrad)"/>
    <path d="M180 455 L290 630 L235 495 Z" fill="#5f0000" opacity="0.8"/>
    <path d="M1420 455 L1310 630 L1365 495 Z" fill="#5f0000" opacity="0.8"/>

    <!-- Laces -->
    <path d="M555 190 Q800 150 1045 190" fill="none" stroke="#5b5b5b" stroke-width="16" stroke-linecap="round"/>
    <g stroke="#6b6b6b" stroke-width="18" stroke-linecap="round">
      <line x1="620" y1="168" x2="614" y2="225"/>
      <line x1="680" y1="160" x2="676" y2="223"/>
      <line x1="740" y1="156" x2="738" y2="221"/>
      <line x1="800" y1="154" x2="800" y2="220"/>
      <line x1="860" y1="156" x2="862" y2="221"/>
      <line x1="920" y1="160" x2="924" y2="223"/>
      <line x1="980" y1="168" x2="986" y2="225"/>
    </g>
  </g>
</svg>
